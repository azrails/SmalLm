seed: 42
model_name: smallm
model_suffix: 70
dataset_dir: datasets/pretrain
tokenizer: Azrail/en_gpt_like_tokenizer
num_proc: 8

training_arguments:
  _target_: transformers.TrainingArguments
  output_dir: models/${model_name}_${model_suffix}
  seed: ${seed}
  data_seed: ${seed}
  push_to_hub: True
  resume_from_checkpoint: False
  hub_model_id: ${model_name}_${model_suffix}
  hub_strategy: checkpoint

  #optimizer params
  optim: adamw_apex_fused
  learning_rate: 1e-3
  weight_decay: 1e-4

  #dataloader params
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 4
  dataloader_num_workers: 3

  #logging params
  gradient_accumulation_steps: 4
  log_level: info
  logging_steps: 50
  run_name: ${model_name}_${model_suffix}
  report_to: wandb
  include_tokens_per_second: True
  include_num_input_tokens_seen: True

  #taining params
  eval_strategy: 'steps'
  eval_steps: 500
  max_grad_norm: 1.0
  max_steps: 70000
  warmup_steps: 500
  lr_scheduler_type: warmup_stable_decay
  lr_scheduler_kwargs:
    num_decay_steps: 14000
  save_steps: 1000
  bf16: True
  bf16_full_eval: True
  gradient_checkpointing: False
  torch_compile_backend: inductor
  torch_compile: True
  torch_compile_mode: max-autotune-no-cudagraphs

model_config:
  _target_: src.models.SmalLmConfig
  hidden_size: 512
  intermediate_size: 1024
  num_hidden_layers: 20
  num_attention_heads: 8
  num_kv_heads: 2
  max_seq_len: 1024
  balancing_coef: 1e-4
  tie_word_embeddings: True
  static_residual: True
  torch_dtype: bfloat16
  use_moe: False
  positional_bias_type: rope
  attn_implementation: flash_attention_2
